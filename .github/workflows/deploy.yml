name: Deploy Node.js API

on:
  push:
    branches: [ 20250910mcp ]
  pull_request:
    branches: [ 20250910mcp ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy'
        required: true
        default: ''

env:
  SSH_HOST: 174.138.10.2
  SSH_USER: ${{ secrets.SSH_USER }}
  WEBHOOK_DOMAIN: webhook.discernible.io
  WEBHOOK_PORT: 3444
  NODE_VERSION: 20

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          
      - name: Setup and Copy Files
        run: |
          echo "Setting up directories..."
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p ~/clienttestapi-app/{certs,logs,data,nginx,promtail,.near-credentials/testnet}"
          echo "Copying API files..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'certs' \
            --exclude '.near-credentials' \
            --exclude 'logs' \
            --exclude 'data' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/clienttestapi-app/

      - name: Deploy Containers
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            set -x
            cd ~/clienttestapi-app
            
            # Clean up existing resources
            echo 'Cleaning up existing resources...'
            podman pod exists clienttestapi-pod && podman pod rm -f clienttestapi-pod
            podman image exists clienttestapi-image:latest && podman rmi -f clienttestapi-image:latest
            podman image exists localhost/clienttestapi-nginx:latest && podman rmi -f localhost/clienttestapi-nginx:latest
            podman image exists localhost/clienttestapi-promtail:latest && podman rmi -f localhost/clienttestapi-promtail:latest
            
            # Create new pod with both API and webhook ports
            echo 'Creating API pod with multiple ports...'
            podman pod create --name clienttestapi-pod -p ${WEBHOOK_PORT}:${WEBHOOK_PORT}
            
            # Build and run API container
            echo 'Building and running API container...'
            echo 'DEBUG: LOKI_URL=${{ vars.LOKI_URL }}'
            echo 'DEBUG: LOKI_TLS_SKIP_VERIFY=${{ vars.LOKI_TLS_SKIP_VERIFY }}'
            echo 'DEBUG: LOKI_BASIC_AUTH length:' \${#LOKI_BASIC_AUTH}
            echo 'DEBUG: RODIT_NEAR_CREDENTIALS_SOURCE=${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}'
            echo 'DEBUG: SERVICE_NAME=${{ vars.SERVICE_NAME }}'
            echo 'DEBUG: SERVERPORT=${{ vars.SERVERPORT }}'
            echo 'DEBUG: API_DEFAULT_OPTIONS_LOG_DIR=${{ vars.API_DEFAULT_OPTIONS_LOG_DIR }}'
            echo 'DEBUG: NEAR_CONTRACT_ID=${{ vars.NEAR_CONTRACT_ID }}'
            echo 'DEBUG: NEAR_CREDENTIALS_FILE_PATH=${{ vars.NEAR_CREDENTIALS_FILE_PATH }}'
            podman build -t clienttestapi-image:latest -f api.Dockerfile .
            
            # Debug: Container will be checked after creation
            
            # Create the credentials directory with correct permissions
            echo '=== Setting up credentials directory ==='
            mkdir -p ~/clienttestapi-app/.near-credentials/testnet
            chmod -R 777 ~/clienttestapi-app/.near-credentials
            
            # Run API container as non-root user (1000:1000)
            echo 'Running API container...'
            podman run -d \
              --pod clienttestapi-pod \
              --name clienttestapi-container \
              --user 1000:1000 \
              --restart=unless-stopped \
              -e LOKI_URL='${{ vars.LOKI_URL }}' \
              -e LOKI_TLS_SKIP_VERIFY='${{ vars.LOKI_TLS_SKIP_VERIFY }}' \
              -e LOKI_BASIC_AUTH='${{ secrets.LOKI_BASIC_AUTH }}' \
              -e RODIT_NEAR_CREDENTIALS_SOURCE='${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}' \
              -e SERVICE_NAME='${{ vars.SERVICE_NAME }}' \
              -e SERVERPORT='${{ vars.SERVERPORT }}' \
              -e API_DEFAULT_OPTIONS_LOG_DIR='${{ vars.API_DEFAULT_OPTIONS_LOG_DIR }}' \
              -e NEAR_CONTRACT_ID='${{ vars.NEAR_CONTRACT_ID }}' \
              -e VAULT_ENDPOINT='${{ vars.VAULT_ENDPOINT }}' \
              -e VAULT_RODIT_KEYVALUE_PATH='${{ vars.VAULT_RODIT_KEYVALUE_PATH }}' \
              -e VAULT_ROLE_ID='${{ secrets.VAULT_ROLE_ID }}' \
              -e VAULT_SECRET_ID='${{ secrets.VAULT_SECRET_ID }}' \
              -e VAULT_TOKEN_TTL='${{ vars.VAULT_TOKEN_TTL }}' \
              -e NEAR_CREDENTIALS_FILE_PATH='${{ vars.NEAR_CREDENTIALS_FILE_PATH }}' \
              -v ~/clienttestapi-app/logs:/app/logs:Z \
              -v ~/clienttestapi-app/data:/app/data:Z \
              -v ~/clienttestapi-app/certs:/app/certs:ro,Z \
              -v ~/clienttestapi-app/.near-credentials:/app/.near-credentials:Z \
              clienttestapi-image:latest

            # Wait for container to fully start
            sleep 5
            
            # Debug: Check container status
            echo '=== Container Status ==='
            podman ps -a | grep clienttestapi-container || echo 'Container not found'
            
            # Debug: Check file system from inside the container
            echo '\n=== Container File System Check ==='
            echo 'Current working directory inside container:'
            podman exec clienttestapi-container pwd || echo 'Could not get working directory'
            
            echo '\nContents of /app/.near-credentials inside container:'
            podman exec clienttestapi-container ls -la /app/.near-credentials/ 2>/dev/null || echo 'No .near-credentials directory found in container'
            
            echo '\nFile permissions inside container:'
            podman exec clienttestapi-container ls -la /app/ 2>/dev/null || echo 'Could not list /app directory'
            
            echo '\nSearching for credential files inside container:'
            podman exec clienttestapi-container find / -path "*/.near-credentials" -type d 2>/dev/null || echo 'No credential directories found in container'
            
            echo '\nDisk usage inside container:'
            podman exec clienttestapi-container df -h 2>/dev/null || echo 'Could not get disk usage'
            
            echo '\nCurrent user inside container:'
            podman exec clienttestapi-container id 2>/dev/null || echo 'Could not get user info'
            
            # Check for any container logs that might indicate file access issues
            echo '\n=== Container Logs (potential file access issues) ==='
            podman logs clienttestapi-container 2>&1 | grep -i -E 'error|warn|credential|file|permission|ENOENT' | tail -n 20 || echo 'No relevant logs found'
            
            # Wait for container to fully start
            sleep 5
            
            # Check if container is running
            echo 'Container status:'
            podman ps -a | grep clienttestapi-container || echo 'Container not found'
            
            # Build and run nginx
            echo 'Building and running nginx...'
            podman build -t localhost/clienttestapi-nginx:latest -f nginx.Dockerfile .
            podman run -d \
              --pod clienttestapi-pod \
              --name clienttestapi-nginx \
              --restart=unless-stopped \
              -v ~/clienttestapi-app/certs:/app/certs:ro,Z \
              -v ~/clienttestapi-app/logs:/app/logs:Z \
              localhost/clienttestapi-nginx:latest

            # Run promtail directly from Grafana's image
            echo 'Running Promtail...'
            podman run -d \
              --pod clienttestapi-pod \
              --name clienttestapi-promtail \
              --restart=unless-stopped \
              -v ~/clienttestapi-app/logs:/app/logs:ro,Z \
              -v ~/clienttestapi-app/promtail/promtail-config.yml:/etc/promtail/config.yml:ro,Z \
              docker.io/grafana/promtail:latest \
              -config.file=/etc/promtail/config.yml
            
            # Check status and logs
            echo 'Container status:'
            podman ps -a
            echo 'API logs:'
            podman logs clienttestapi-container || true
            echo 'Nginx logs:'
            podman logs clienttestapi-nginx || true
            echo 'Promtail logs:'
            podman logs clienttestapi-promtail || true
          "