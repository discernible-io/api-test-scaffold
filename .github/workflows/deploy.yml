name: Deploy Node.js API

on:
  push:
    branches: [ idclaw ]
  pull_request:
    branches: [ idclaw ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy'
        required: true
        default: ''

env:
  SSH_HOST: 174.138.10.2
  SSH_USER: ${{ secrets.SSH_USER }}
  WEBHOOK_DOMAIN: webhook.discernible.io
  WEBHOOKPORT: 3444
  NODE_VERSION: 20

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          
      - name: Setup and Copy Files
        run: |
          echo "Setting up directories..."
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p ~/clienttestapi-app/{certs,logs,data,nginx} && mkdir -p ~/clienttestapi-app/logs/nginx && chmod 0775 ~/clienttestapi-app/logs/nginx || true && podman unshare chown -R 101:101 ~/clienttestapi-app/logs/nginx || true"
          echo "Copying API files..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'certs' \
            --exclude 'logs' \
            --exclude 'data' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/clienttestapi-app/

      - name: Deploy Containers
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            set -x
            cd ~/clienttestapi-app

            # Nginx TLS: create self-signed fullchain.pem + privkey.pem if none on host (see scripts/generate-self-signed-certs.sh)
            if [ ! -s ~/clienttestapi-app/certs/fullchain.pem ] || [ ! -s ~/clienttestapi-app/certs/privkey.pem ]; then
              bash ~/clienttestapi-app/scripts/generate-self-signed-certs.sh ~/clienttestapi-app/certs
            fi
            
            # Clean up existing resources
            echo 'Cleaning up existing resources...'
            podman pod exists clienttestapi-pod && podman pod rm -f clienttestapi-pod
            podman image exists clienttestapi-image:latest && podman rmi -f clienttestapi-image:latest
            podman image exists localhost/clienttestapi-nginx:latest && podman rmi -f localhost/clienttestapi-nginx:latest
            
            # Create new pod
            echo 'Creating API pod...'
            podman pod create --name clienttestapi-pod -p ${WEBHOOKPORT}:${WEBHOOKPORT}
            
            # Build and run API container
            echo 'Building and running API container...'
            echo 'DEBUG: LOKI_URL=${{ vars.LOKI_URL }}'
            echo 'DEBUG: LOKI_TLS_SKIP_VERIFY=${{ vars.LOKI_TLS_SKIP_VERIFY }}'
            echo 'DEBUG: LOKI_BASIC_AUTH length:' \${#LOKI_BASIC_AUTH}
            echo 'DEBUG: RODIT_NEAR_CREDENTIALS_SOURCE=${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}'
            echo 'DEBUG: SERVICE_NAME=${{ vars.SERVICE_NAME }}'
            echo 'DEBUG: SERVERPORT=${{ vars.SERVERPORT }}'
            echo 'DEBUG: API_DEFAULT_OPTIONS_LOG_DIR=${{ vars.API_DEFAULT_OPTIONS_LOG_DIR }}'
            echo 'DEBUG: NEAR_CONTRACT_ID=${{ vars.NEAR_CONTRACT_ID }}'
            echo 'DEBUG: VAULT_ENDPOINT=${{ vars.VAULT_ENDPOINT }}'
            echo 'DEBUG: VAULT_RODIT_KEYVALUE_PATH=${{ vars.VAULT_RODIT_KEYVALUE_PATH }}'
            echo 'DEBUG: VAULT_ROLE_ID: [provided via secrets]'
            echo 'DEBUG: VAULT_SECRET_ID: [provided via secrets]'
            echo 'DEBUG: VAULT_TOKEN_TTL=${{ vars.VAULT_TOKEN_TTL }}'
            podman build -t clienttestapi-image:latest -f api.Dockerfile .
            
            # Ensure logs and data directories exist with correct permissions
            echo 'Setting up logs and data directories...'
            mkdir -p ~/clienttestapi-app/logs ~/clienttestapi-app/data
            # Set ownership to 1000:1000 (nodeuser:nodeuser in container)
            podman unshare chown -R 1000:1000 ~/clienttestapi-app/logs ~/clienttestapi-app/data || true
            # Ensure the data directory is writable by the container user
            podman unshare chmod g+w ~/clienttestapi-app/data
            
            # Run API container
            echo 'Running API container...'
            podman run -d \
              --pod clienttestapi-pod \
              --name clienttestapi-container \
              --user 1000:1000 \
              --restart=unless-stopped \
              -e LOKI_URL='${{ vars.LOKI_URL }}' \
              -e LOKI_TLS_SKIP_VERIFY='${{ vars.LOKI_TLS_SKIP_VERIFY }}' \
              -e LOKI_BASIC_AUTH='${{ secrets.LOKI_BASIC_AUTH }}' \
              -e RODIT_NEAR_CREDENTIALS_SOURCE='${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}' \
              -e SERVICE_NAME='${{ vars.SERVICE_NAME }}' \
              -e API_DEFAULT_OPTIONS_WEBHOOKPORT='${{ vars.API_DEFAULT_OPTIONS_WEBHOOKPORT }}' \
              -e SERVERPORT='${{ vars.SERVERPORT }}' \
              -e API_DEFAULT_OPTIONS_LOG_DIR='${{ vars.API_DEFAULT_OPTIONS_LOG_DIR }}' \
              -e NEAR_CONTRACT_ID='${{ vars.NEAR_CONTRACT_ID }}' \
              -e NEAR_RPC_URL='${{ secrets.NEAR_RPC_URL }}' \
              -e VAULT_ENDPOINT='${{ vars.VAULT_ENDPOINT }}' \
              -e VAULT_RODIT_KEYVALUE_PATH='${{ vars.VAULT_RODIT_KEYVALUE_PATH }}' \
              -e VAULT_ROLE_ID='${{ secrets.VAULT_ROLE_ID }}' \
              -e VAULT_SECRET_ID='${{ secrets.VAULT_SECRET_ID }}' \
              -e VAULT_TOKEN_TTL='${{ vars.VAULT_TOKEN_TTL }}' \
              -e NEAR_CREDENTIALS_FILE_PATH='${{ vars.NEAR_CREDENTIALS_FILE_PATH }}' \
              -e RATE_LIMIT_LOGIN_TIMESTAMP_MAX='${{ vars.RATE_LIMIT_LOGIN_TIMESTAMP_MAX }}' \
              -e RATE_LIMIT_LOGIN_TIMESTAMP_WINDOW_MINUTES='${{ vars.RATE_LIMIT_LOGIN_TIMESTAMP_WINDOW_MINUTES }}' \
              -v ~/clienttestapi-app/logs:/app/logs:Z \
              -v ~/clienttestapi-app/data:/app/data:Z \
              -v ~/clienttestapi-app/certs:/app/certs:ro,Z \
              clienttestapi-image:latest
            
            # Build and run nginx
            echo 'Building and running nginx...'
            podman build -t localhost/clienttestapi-nginx:latest -f nginx.Dockerfile .
            # Ensure nginx log directory exists on host before mounting and is writable by container user
            mkdir -p ~/clienttestapi-app/logs/nginx
            chmod 0775 ~/clienttestapi-app/logs/nginx || true
            podman unshare chown -R 101:101 ~/clienttestapi-app/logs/nginx || true
            podman run -d \
              --pod clienttestapi-pod \
              --name clienttestapi-nginx \
              --restart=unless-stopped \
              -v ~/clienttestapi-app/certs:/app/certs:ro,Z \
              -v ~/clienttestapi-app/logs/nginx:/var/log/nginx:Z,U \
              localhost/clienttestapi-nginx:latest
            
            # Check status and logs
            echo 'Container status:'
            podman ps -a
            echo 'API logs:'
            podman logs clienttestapi-container || true
            echo 'Nginx logs:'
            podman logs clienttestapi-nginx || true
          "