name: Deploy clienttest-idc API

on:
  push:
    branches: [ main, development ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy'
        required: false
        default: ''

env:
  SSH_HOST: ${{ github.ref == 'refs/heads/main' && secrets.SSH_HOST_MAIN || secrets.SSH_HOST_DEVELOPMENT }}
  SSH_USER: ${{ github.ref == 'refs/heads/main' && secrets.SSH_USER_MAIN || secrets.SSH_USER_DEVELOPMENT }}
  SSH_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY_MAIN || secrets.SSH_PRIVATE_KEY_DEVELOPMENT }}
  SSH_KNOWN_HOSTS: ${{ github.ref == 'refs/heads/main' && secrets.SSH_KNOWN_HOSTS_MAIN || secrets.SSH_KNOWN_HOSTS_DEVELOPMENT }}
  # Must match server_name in nginx/nginx.main.conf and nginx/nginx.development.conf (health check only).
  DOMAIN: ${{ github.ref == 'refs/heads/main' && 'webhook.discernible.io' || 'webhook.dihola.io' }}
  APP_PORT: 7443
  APP_DIR: /home/dedalo43/clienttest-app
  POD_NAME: clienttest-idc-pod
  APP_CONTAINER_NAME: clienttest-idc-container
  NGINX_CONTAINER_NAME: clienttest-nginx
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}/clienttest-idc
  NGINX_IMAGE_NAME: ${{ github.repository }}/clienttest-nginx
  HEALTH_CHECK_MAX_ATTEMPTS: 5
  HEALTH_CHECK_INTERVAL: 5

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run CI tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Scan for secrets
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner

      - name: Enforce minimum package age
        run: node scripts/enforce-minimum-package-age.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx.Dockerfile
          push: true
          build-args: |
            NODE_ENV=${{ github.ref == 'refs/heads/main' && 'main' || 'development' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-and-deploy:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ env.SSH_KNOWN_HOSTS }}

      - name: Setup directories and login to GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p ${{ env.APP_DIR }}/{certs,logs,data,nginx,secrets} && mkdir -p ${{ env.APP_DIR }}/logs/nginx && chmod 711 ${{ env.APP_DIR }}/certs && chmod 750 ${{ env.APP_DIR }}/secrets && chmod 0775 ${{ env.APP_DIR }}/logs/nginx && podman unshare chown -R 101:101 ${{ env.APP_DIR }}/logs/nginx || true"
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "::error::GHCR_PULL_TOKEN secret is missing or empty. Add a PAT with read:packages scope."
            exit 1
          fi
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
            "podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Deploy containers
        id: deploy
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            set -euxo pipefail
            cd ${{ env.APP_DIR }}

            for c in ${{ env.APP_CONTAINER_NAME }} ${{ env.NGINX_CONTAINER_NAME }}; do
              podman container exists \"\$c\" && podman rm -f \"\$c\" || true
            done
            podman pod exists ${{ env.POD_NAME }} && podman pod rm -f ${{ env.POD_NAME }} || true

            podman pull ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}
            podman pull ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}

            podman pod create --name ${{ env.POD_NAME }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }}

            mkdir -p ${{ env.APP_DIR }}/logs ${{ env.APP_DIR }}/data
            chmod 755 ${{ env.APP_DIR }}/logs || true
            podman unshare chown -R \$(id -u):\$(id -g) ${{ env.APP_DIR }}/logs ${{ env.APP_DIR }}/data || true
            podman unshare chmod g+w ${{ env.APP_DIR }}/data || true

            ENV_FILES='--env-file ${{ env.APP_DIR }}/secrets/secrets.env'
            if [ -f '${{ env.APP_DIR }}/secrets/testing.env' ]; then
              ENV_FILES=\"\$ENV_FILES --env-file ${{ env.APP_DIR }}/secrets/testing.env\"
            fi

            podman run -d \
              --log-driver=k8s-file \
              --pod ${{ env.POD_NAME }} \
              --name ${{ env.APP_CONTAINER_NAME }} \
              --restart=unless-stopped \
              \$ENV_FILES \
              -e NODE_ENV='${{ github.ref == 'refs/heads/main' && 'main' || 'development' }}' \
              -v ${{ env.APP_DIR }}/logs:/app/logs:Z \
              -v ${{ env.APP_DIR }}/data:/app/data:Z \
              -v ${{ env.APP_DIR }}/certs:/app/certs:ro,Z \
              ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}

            podman container exists ${{ env.APP_CONTAINER_NAME }}
            podman inspect ${{ env.APP_CONTAINER_NAME }} --format '{{.State.Status}}' | grep -E 'running|created'

            mkdir -p ${{ env.APP_DIR }}/logs/nginx
            chmod 0775 ${{ env.APP_DIR }}/logs/nginx || true
            podman unshare chown -R 101:101 ${{ env.APP_DIR }}/logs/nginx || true

            chmod 711 ${{ env.APP_DIR }}/certs || true
            CERT_DIR=${{ env.APP_DIR }}/certs
            for f in privkey.pem tls.key; do
              if [ -f \$CERT_DIR/\$f ]; then
                podman unshare chown 101:101 \$CERT_DIR/\$f || true
                podman unshare chmod 600 \$CERT_DIR/\$f || true
              fi
            done
            for f in fullchain.pem chain.pem cert.pem tls.crt; do
              if [ -f \$CERT_DIR/\$f ]; then
                podman unshare chown 101:101 \$CERT_DIR/\$f || true
                podman unshare chmod 644 \$CERT_DIR/\$f || true
              fi
            done

            podman run -d \
              --log-driver=k8s-file \
              --pod ${{ env.POD_NAME }} \
              --name ${{ env.NGINX_CONTAINER_NAME }} \
              --restart=unless-stopped \
              -v ${{ env.APP_DIR }}/certs:/app/certs:ro,Z \
              -v ${{ env.APP_DIR }}/logs/nginx:/var/log/nginx:Z \
              ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}

            podman ps -a
            podman logs ${{ env.APP_CONTAINER_NAME }} || true
            podman logs ${{ env.NGINX_CONTAINER_NAME }} || true
          "

      - name: Health check
        id: health-check
        continue-on-error: true
        env:
          MAX_ATTEMPTS: ${{ env.HEALTH_CHECK_MAX_ATTEMPTS }}
          INTERVAL: ${{ env.HEALTH_CHECK_INTERVAL }}
          DOMAIN: ${{ env.DOMAIN }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::DOMAIN is empty. Check deploy.yml DOMAIN mapping for this branch."
            exit 1
          fi
          HEALTH_URL="https://${DOMAIN}:${APP_PORT}/health"
          echo "Probing: ${HEALTH_URL}"
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -sk -m 5 "${HEALTH_URL}" 2>/dev/null | grep -q healthy; then
              echo "Service is healthy"
              echo "health_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep $INTERVAL
            fi
          done
          echo "Service failed health check"
          body=$(mktemp)
          code=$(curl -sk -m 15 -o "${body}" -w "%{http_code}" "${HEALTH_URL}") || true
          echo "HTTP status: ${code:-000} (000 usually means no TCP/TLS response from this runner)"
          head -c 800 "${body}" 2>/dev/null || true
          echo
          rm -f "${body}"
          echo "health_status=failed" >> "$GITHUB_OUTPUT"
          echo "::warning::Health check failed - service may not be reachable from the runner. Containers were deployed; deployment-time test suite may still run in the API container. Verify manually."
          exit 0
