name: Deploy Node.js API
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  SSH_HOST: 178.128.173.226
  SSH_USER: ${{ secrets.SSH_USER }}
  API_DOMAIN: dev-api.aparejos.net
  API_PORT: 5443
  NODE_VERSION: 18
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Setup and Copy Files
        run: |
          echo "Setting up directories..."
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p ~/clientestapi-app/{certs,logs,data,nginx}"
          
          echo "Copying API files..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'certs' \
            --exclude 'logs' \
            --exclude 'data' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/clientestapi-app/
      - name: Deploy Containers
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            set -x
            cd ~/clientestapi-app
            # Clean up existing resources
            echo 'Cleaning up existing resources...'
            podman pod exists clientestapi-pod && podman pod rm -f clientestapi-pod
            podman image exists clientestapi-image:latest && podman rmi -f clientestapi-image:latest
            podman image exists localhost/clientestapi-nginx:latest && podman rmi -f localhost/clientestapi-nginx:latest
            # Create new pod
            echo 'Creating API pod...'
            podman pod create --name clientestapi-pod -p ${API_PORT}:${API_PORT}
            # Build and run API container
            echo 'Building and running API container...'
            podman build -t clientestapi-image:latest -f api.Dockerfile .
            podman run -d \
              --pod clientestapi-pod \
              --name clientestapi-container \
              --restart=unless-stopped \
              -v ~/clientestapi-app/logs:/app/logs:z \
              -v ~/clientestapi-app/data:/app/data:z \
              -v ~/clientestapi-app/certs:/app/certs:ro,z \
              clientestapi-image:latest
            # Build and run nginx
            echo 'Building and running nginx...'
            podman build -t localhost/clientestapi-nginx:latest -f nginx.Dockerfile .
            podman run -d \
              --pod clientestapi-pod \
              --name clientestapi-nginx \
              --restart=unless-stopped \
              -v ~/clientestapi-app/certs:/app/certs:ro,z \
              localhost/clientestapi-nginx:latest
            # Check status and logs
            echo 'Container status:'
            podman ps -a
            echo 'API logs:'
            podman logs clientestapi-container || true
            echo 'Nginx logs:'
            podman logs clientestapi-nginx || true
          "