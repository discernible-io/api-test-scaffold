worker_processes auto;
worker_rlimit_nofile 65535;  # Increase open file limit for workers
error_log /app/logs/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;  # Increased from 1024 for better concurrency
    multi_accept on;          # Accept as many connections as possible
    use epoll;                # More efficient event processing for Linux
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 10.0.2.3 valid=30s ipv6=off;  # Explicit IPv6 off if not needed

    # Enhanced logging format with request ID for better tracing
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" '
                      'forwarded_for="$http_x_forwarded_for" '
                      'real_ip="$remote_addr" '
                      'x_real_ip="$http_x_real_ip" '
                      'request_time=$request_time '
                      'request_id="$http_x_request_id" '
                      'upstream_addr="$upstream_addr" '
                      'upstream_response_time="$upstream_response_time"';
    access_log /app/logs/nginx_access.log detailed buffer=64k flush=5s;

    # File handling optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keep-alive settings
    keepalive_timeout 65;
    keepalive_requests 1000;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # Disable TLS session tickets for better security
    ssl_dhparam /etc/nginx/dhparam.pem;  # Add custom DH parameters for better security
    ssl_ecdh_curve secp384r1;  # Specify ECDH curve for better security
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Add header size limits
    large_client_header_buffers 4 16k;  # Increased from 8k to 16k
    client_header_buffer_size 2k;       # Increased from 1k to 2k
    
    # Protect against large payload attacks
    client_max_body_size 1M;
    client_body_timeout 15s;            # Increased from 10s to 15s
    client_body_buffer_size 128k;
    
    # Security headers
    server_tokens off;
    
    # Compression settings
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
    
    # Common security headers for all responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Rate limiting zone definitions removed to allow webhook reception

    # CORS origin mapping
    map $http_origin $cors_origin {
        default "";
        "https://testnet-serverfe.cableguard.net:6443" "$http_origin";
        "https://testnet-serverfe.cableguard.net:2443" "$http_origin";
        "https://testnet-clientfe.cableguard.net:4443" "$http_origin";
        "https://dev-api.discernible.io:3443" "$http_origin";
    }

    # Upstream definition for load balancing
    upstream api_backend {
        server clienttestapi-container:8080;
        keepalive 32;  # Keep connections to upstream open
    }

    server {
        listen 3443 ssl http2;
        server_name dev-api.discernible.io;
        
        # SSL configuration
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        
        # Security: prevent exposure of sensitive headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
        proxy_hide_header X-Runtime;
        
        # Buffer settings for proxy
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        
        # Default error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"UP"}';
        }
        
        location / {
            # Rate limiting removed to allow webhook reception
            
            # Default limit for API requests
            client_max_body_size 1M;
            
            # Handle CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Origin, X-Requested-With, Accept, X-RODIT-Token, X-Request-ID' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' '3600' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=utf-8';
                return 204;
            }

            # Add CORS headers for actual requests
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Proxy to backend
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # Proxy headers with explicit order
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Error handling
            proxy_intercept_errors on;
            error_page 413 = @payload_too_large;
            error_page 429 = @rate_limited;
            error_page 502 504 = @handle_error;
        }

        # Add specific limits for different API endpoints based on their needs
        location /api/uploads/ {
            # Rate limiting removed to allow webhook reception
            client_max_body_size 10M;
            
            # Other directives same as the root location
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Longer timeouts for uploads
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Custom error response for payload too large
        location @payload_too_large {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'application/json' always;
            return 413 '{"error": "Payload too large", "message": "The request payload exceeds the allowed size limit"}';
        }

        # Custom error response for rate limiting
        location @rate_limited {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'application/json' always;
            add_header 'Retry-After' '30' always;
            return 429 '{"error": "Too many requests", "message": "Please try again later"}';
        }

        # Custom error response for backend errors
        location @handle_error {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'application/json' always;
            return 502 '{"error": "Bad gateway", "message": "The server is temporarily unavailable"}';
        }
    }
}
